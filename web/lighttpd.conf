server.document-root = "/opt/matcheng/web/htdocs"
server.port          = 8080
server.username      = "www-data"
server.groupname     = "www-data"
server.tag           = "MATCHENG"

server.modules = ("mod_alias", "mod_cgi")
index-file.names = ("index.html")

alias.url = ("/cgi-bin/" => "/opt/matcheng/web/cgi-bin/")
$HTTP["url"] =~ "^/cgi-bin/" {
    cgi.assign = (".cgi" => "")
}

